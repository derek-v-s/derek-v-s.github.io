<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="author" content="{{ site.author | escape }}">
  <title>{{ page.title | default: site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/complex_octagon_128.png' | relative_url }}">
</head>
<body>
  <main>
    <a href="{{ '/' | relative_url }}"><img src="{{ '/complex_octagon_128.png' | relative_url }}" alt="Complex octagon" class="center"></a>

    <header>
      <h1>{{ page.title | default: site.title | escape }}</h1>
      {% if page.byline %}<div class="author">{{ page.byline | escape }}</div>{% endif %}
    </header>

    <section>
      {{ content }}
    </section>
  </main>
</body>
</html>
